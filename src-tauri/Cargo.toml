[package]
name = "breakpoint"
version = "0.1.0"
description = "Breakpoint Desktop Application"
authors = ["Manas"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

[[bin]]
name = "Breakpoint"
path = "src/main.rs"

[lib]
name = "breakpoint_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.0", features = [] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"

